<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" width="1000" height="24" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <rect x="0" y="11" width="1000" height="2" fill="url(#l)"/>
  <circle cx="0" cy="12" r="6" fill="#60A5FA" filter="url(#glow)">
    <animate attributeName="cx" values="0;1000;0" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="0" cy="12" r="2.5" fill="#ffffff">
    <animate attributeName="cx" values="0;1000;0" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
