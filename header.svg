<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Erlan Irhab Ghalib - System Developer and Data Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="280" fill="url(#bg)"/>

  <!-- twinkling stars -->
  <g fill="#ffffff">
    <circle cx="60" cy="40" r="1.5" opacity="0.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="95" r="1" opacity="0.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="30" r="1.8" opacity="0.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.0s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="60" r="1.2" opacity="0.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="35" r="1.5" opacity="0.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="730" cy="80" r="1" opacity="0.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="28" r="1.8" opacity="0.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="90" r="1.2" opacity="0.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="150" r="1" opacity="0.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="905" cy="160" r="1.5" opacity="0.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- floating code symbols -->
  <g font-family="'Courier New', monospace" font-size="20" fill="#A78BFA" opacity="0.35">
    <text x="70" y="120">&lt;/&gt;<animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="5s" repeatCount="indefinite"/></text>
    <text x="180" y="190">{ }<animateTransform attributeName="transform" type="translate" values="0 0;0 12;0 0" dur="6s" repeatCount="indefinite"/></text>
    <text x="800" y="125">SELECT *<animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="4.5s" repeatCount="indefinite"/></text>
    <text x="880" y="195">01<animateTransform attributeName="transform" type="translate" values="0 0;0 14;0 0" dur="5.5s" repeatCount="indefinite"/></text>
    <text x="700" y="195">dbt<animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="6.5s" repeatCount="indefinite"/></text>
  </g>

  <!-- greeting -->
  <text x="500" y="72" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#c4b5fd" opacity="0">
    Hi there, I'm
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.2s" fill="freeze"/>
  </text>

  <!-- name -->
  <text x="500" y="128" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="54" font-weight="800" fill="url(#tg)" opacity="0">
    Erlan Irhab Ghalib
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 24;0 0" dur="1.2s" begin="0.5s" fill="freeze"/>
  </text>

  <!-- rotating roles -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="25" fill="#e0e7ff" text-anchor="middle">
    <text x="500" y="172" opacity="0">System Developer
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.21;0.25" dur="12s" begin="1.5s" repeatCount="indefinite"/></text>
    <text x="500" y="172" opacity="0">Data Engineer
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.21;0.25" dur="12s" begin="4.5s" repeatCount="indefinite"/></text>
    <text x="500" y="172" opacity="0">Cloud Computing Enthusiast
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.21;0.25" dur="12s" begin="7.5s" repeatCount="indefinite"/></text>
    <text x="500" y="172" opacity="0">Building Scalable Systems
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.21;0.25" dur="12s" begin="10.5s" repeatCount="indefinite"/></text>
  </g>

  <!-- waves -->
  <path d="M0 215 Q125 185 250 215 T500 215 T750 215 T1000 215 T1250 215 T1500 215 T1750 215 T2000 215 V280 H0 Z" fill="#6d28d9" opacity="0.35">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="6s" repeatCount="indefinite"/>
  </path>
  <path d="M-500 234 Q-375 204 -250 234 T0 234 T250 234 T500 234 T750 234 T1000 234 T1250 234 T1500 234 V280 H-500 Z" fill="#7c3aed" opacity="0.45">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="500 0" dur="9s" repeatCount="indefinite"/>
  </path>
  <path d="M0 250 Q125 228 250 250 T500 250 T750 250 T1000 250 T1250 250 T1500 250 T1750 250 T2000 250 V280 H0 Z" fill="#4c1d95" opacity="0.85">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="4s" repeatCount="indefinite"/>
  </path>
</svg>
