<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img" aria-label="Languages I use" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="1" y="1" width="698" height="298" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="24" y="38" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#A78BFA">Languages I Use</text>

  <g font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#e5e7eb">
    <!-- PHP 90 -->
    <text x="24" y="77">PHP</text>
    <rect x="140" y="65" width="460" height="14" rx="7" fill="#1f2937"/>
    <rect x="140" y="65" width="0" height="14" rx="7" fill="#777BB4">
      <animate attributeName="width" values="0;414;414" keyTimes="0;0.25;1" dur="9s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <text x="615" y="77">90%</text>

    <!-- HTML/CSS 80 -->
    <text x="24" y="115">HTML / CSS</text>
    <rect x="140" y="103" width="460" height="14" rx="7" fill="#1f2937"/>
    <rect x="140" y="103" width="0" height="14" rx="7" fill="#E34F26">
      <animate attributeName="width" values="0;368;368" keyTimes="0;0.25;1" dur="9s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <text x="615" y="115">80%</text>

    <!-- JS 75 -->
    <text x="24" y="153">JavaScript</text>
    <rect x="140" y="141" width="460" height="14" rx="7" fill="#1f2937"/>
    <rect x="140" y="141" width="0" height="14" rx="7" fill="#F7DF1E">
      <animate attributeName="width" values="0;345;345" keyTimes="0;0.25;1" dur="9s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <text x="615" y="153">75%</text>

    <!-- Python 65 -->
    <text x="24" y="191">Python</text>
    <rect x="140" y="179" width="460" height="14" rx="7" fill="#1f2937"/>
    <rect x="140" y="179" width="0" height="14" rx="7" fill="#3776AB">
      <animate attributeName="width" values="0;299;299" keyTimes="0;0.25;1" dur="9s" begin="0.9s" repeatCount="indefinite"/>
    </rect>
    <text x="615" y="191">65%</text>

    <!-- Dart 50 -->
    <text x="24" y="229">Dart</text>
    <rect x="140" y="217" width="460" height="14" rx="7" fill="#1f2937"/>
    <rect x="140" y="217" width="0" height="14" rx="7" fill="#0175C2">
      <animate attributeName="width" values="0;230;230" keyTimes="0;0.25;1" dur="9s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <text x="615" y="229">50%</text>

    <!-- Kotlin 40 -->
    <text x="24" y="267">Kotlin</text>
    <rect x="140" y="255" width="460" height="14" rx="7" fill="#1f2937"/>
    <rect x="140" y="255" width="0" height="14" rx="7" fill="#7F52FF">
      <animate attributeName="width" values="0;184;184" keyTimes="0;0.25;1" dur="9s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <text x="615" y="267">40%</text>
  </g>
</svg>
